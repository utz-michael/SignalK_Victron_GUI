<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Victron GUI</title>
<style>
html,body{height:100%;margin:0;background:#0a1a24;overflow:hidden}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0a1a24}
/* Nur im Direktmodus (ohne Proxy): Randstreifen, auf denen das App Dock Doppelklicks hört. */
.edge{position:fixed;top:0;bottom:0;width:var(--edge,24px);z-index:5;background:transparent;touch-action:manipulation;display:none}
body.direct .edge{display:block}
#eL{left:0}
#eR{right:0}
</style>
</head>
<body>
<iframe id="frame" title="Victron GUI v2" allow="fullscreen" referrerpolicy="no-referrer"></iframe>
<div class="edge" id="eL" aria-hidden="true"></div>
<div class="edge" id="eR" aria-hidden="true"></div>

<script>
(function(){
  // Direktmodus (Fallback, wenn das Proxy-Plugin nicht antwortet). Adresse: ?url=http://192.168.x.x/gui-v2/
  var DEFAULT_URL = "http://venus.local/gui-v2/";
  var DEFAULT_EDGE = 24;
  var K = "signalk-victron-gui";
  var frame = document.getElementById("frame");

  function load(){ try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return {}} }
  function store(c){ try{localStorage.setItem(K,JSON.stringify(c))}catch(e){} }

  var p = new URLSearchParams(location.search), cfg = load();
  if(p.has("reset")) cfg = {};
  if(p.has("reload")) cfg.reload = Math.max(0, parseInt(p.get("reload"),10)||0);    // Minuten, 0 = aus
  if(p.has("edge"))   cfg.edge   = Math.max(0, parseInt(p.get("edge"),10)||0);      // Pixel (nur Direktmodus)
  var forced = p.get("url");                                                         // erzwingt Direktmodus
  if(forced) cfg.url = forced;
  store(cfg);

  // ?debug zeigt unten links, welcher Modus aktiv ist und warum
  function note(t){
    try{ console.log("[victron-gui] "+t); }catch(e){}
    if(!p.has("debug")) return;
    var d = document.getElementById("dbg");
    if(!d){ d=document.createElement("div"); d.id="dbg";
      d.style.cssText="position:fixed;left:8px;bottom:8px;z-index:20;max-width:90vw;padding:6px 10px;border-radius:6px;background:#122b3a;color:#e6f0f5;font:13px system-ui;border:1px solid #24485e";
      document.body.appendChild(d); }
    d.textContent = t;
  }

  var src = null;
  function start(u, direct){
    src = u; frame.src = u;
    if(direct){
      var edge = (cfg.edge===undefined) ? DEFAULT_EDGE : cfg.edge;
      document.documentElement.style.setProperty("--edge", edge+"px");
      if(edge>0) document.body.classList.add("direct");
    }
    if(cfg.reload>0) setInterval(function(){ frame.src = src; }, cfg.reload*60000);
  }

  if(forced){ start(forced, true); note("Direktmodus (?url=): "+forced); return; }

  // Proxy-Modus: Adresse kommt vom Plugin (gleicher Origin wie das App Dock -> Doppelklick überall).
  // Ein evtl. gespeicherter Direkt-Link zählt nur als Fallback, nie als Vorrang.
  fetch("/plugins/signalk-victron-gui/info", {credentials:"include"})
    .then(function(r){
      if(!r.ok) throw new Error("HTTP "+r.status);
      return r.json().catch(function(){ throw new Error("Antwort ist kein JSON (Plugin nicht geladen/aktiv?)"); });
    })
    .then(function(j){
      if(!j || !j.guiUrl) throw new Error("ungültige Antwort");
      start(j.guiUrl, false); note("Proxy-Modus: "+j.guiUrl);
    })
    .catch(function(e){
      start(cfg.url || DEFAULT_URL, true); note("Direktmodus, Grund: "+e.message);
    });
})();
</script>
</body>
</html>
